name: ci
on: { push: { branches: [main] }, pull_request: {} }
permissions: { contents: read, security-events: write }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: amrutam, POSTGRES_PASSWORD: amrutam, POSTGRES_DB: amrutam_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U amrutam" --health-interval 5s --health-retries 10
    env: { TEST_DATABASE_URL: "postgres://amrutam:amrutam@localhost:5432/amrutam_test" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run audit:deps            # dependency vulnerability scan (fails on high/critical)
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2   # secret scanning
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: github/codeql-action/init@v3
        with: { languages: javascript }
      - uses: github/codeql-action/analyze@v3   # SAST
  image:
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t amrutam-api:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@0.24.0   # container CVE scan
        with: { image-ref: "amrutam-api:${{ github.sha }}", severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true }
      # On main: push to ECR (OIDC role, no long-lived keys), then `kubectl set image` / ArgoCD sync with progressive rollout.
