apiVersion: apps/v1
kind: Deployment
metadata: { name: amrutam-api, labels: { app: amrutam-api } }
spec:
  replicas: 4
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 25%, maxUnavailable: 0 } }   # zero-downtime
  selector: { matchLabels: { app: amrutam-api } }
  template:
    metadata: { labels: { app: amrutam-api }, annotations: { prometheus.io/scrape: "true", prometheus.io/port: "3000" } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: DoNotSchedule, labelSelector: { matchLabels: { app: amrutam-api } } }
      containers:
        - name: api
          image: REGISTRY/amrutam-api:TAG
          ports: [{ containerPort: 3000 }]
          envFrom: [{ secretRef: { name: amrutam-secrets } }]   # synced from AWS Secrets Manager (External Secrets Operator)
          env: [{ name: NODE_ENV, value: production }]
          readinessProbe: { httpGet: { path: /readyz, port: 3000 }, periodSeconds: 5, failureThreshold: 3 }
          livenessProbe:  { httpGet: { path: /healthz, port: 3000 }, periodSeconds: 10 }
          startupProbe:   { httpGet: { path: /healthz, port: 3000 }, failureThreshold: 30, periodSeconds: 2 }
          resources: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: "1", memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          lifecycle: { preStop: { exec: { command: ["sleep", "10"] } } }   # let LB deregister before SIGTERM drain
      terminationGracePeriodSeconds: 40
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: amrutam-worker }
spec:
  replicas: 2
  selector: { matchLabels: { app: amrutam-worker } }
  template:
    metadata: { labels: { app: amrutam-worker } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: worker
          image: REGISTRY/amrutam-api:TAG
          command: ["node", "src/worker.js"]
          envFrom: [{ secretRef: { name: amrutam-secrets } }]
          env: [{ name: NODE_ENV, value: production }]
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: amrutam-api }
spec: { selector: { app: amrutam-api }, ports: [{ port: 80, targetPort: 3000 }] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: amrutam-api }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: amrutam-api }
  minReplicas: 4
  maxReplicas: 40
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } } }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: amrutam-api }
spec: { minAvailable: 3, selector: { matchLabels: { app: amrutam-api } } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: amrutam-api }
spec:
  podSelector: { matchLabels: { app: amrutam-api } }
  policyTypes: [Ingress]
  ingress: [{ from: [{ namespaceSelector: { matchLabels: { name: ingress } } }, { namespaceSelector: { matchLabels: { name: monitoring } } }], ports: [{ port: 3000 }] }]
